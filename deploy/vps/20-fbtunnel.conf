# /etc/ssh/sshd_config.d/20-fbtunnel.conf — the collector's tunnel user (DESIGN, Operations).
# The fbtunnel user may open exactly one local forward, to the brain's ingest port on the
# VPS's loopback, and nothing else: no shell, no TTY, no remote listeners, no agent or X11,
# no Unix sockets. Its keys live in a root-owned file it cannot edit. MaxSessions 0 refuses
# every shell, exec and subsystem session while still allowing the forward (sshd_config(5));
# the client asks for none (`ssh -N`). A session the network dropped is cleaned up after
# 4 x 30 s without an answer. deploy/vps/setup-fbtunnel.sh installs it and checks it.

Match User fbtunnel
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:8781
    PermitListen none
    AllowStreamLocalForwarding no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTTY no
    PermitUserRC no
    GatewayPorts no
    ForceCommand /bin/false
    AuthorizedKeysFile /etc/ssh/fbtunnel_keys
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    MaxSessions 0
    ClientAliveInterval 30
    ClientAliveCountMax 4
