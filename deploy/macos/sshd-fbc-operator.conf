# /etc/ssh/sshd_config.d/200-fbc-operator.conf — key-only ssh into the collector's account
# (RUNBOOK §12). Remote Login is limited to the fbc user in System Settings; its only key is the
# operator's, which authorized_keys pins to this Mac (from=) and to fbc-operator.sh (command=).
Match User fbc
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	AuthenticationMethods publickey
	AllowTcpForwarding no
	AllowStreamLocalForwarding no
	AllowAgentForwarding no
	X11Forwarding no
	PermitTunnel no
	PermitUserRC no
