[project]
name = "fbwire"
version = "0.1.0"
description = "Wire models shared by the ddiver-fb collector and brain."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fbwire"]
