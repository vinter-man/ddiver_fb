[project]
name = "fbcollector"
version = "0.1.0"
description = "Home collector for ddiver-fb: reads Facebook groups through a real Chrome session, passively."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fbwire",
  "patchright>=1.63",
  "aiosqlite>=0.21",
  "httpx>=0.28",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "tzdata>=2025.1",
  "jeepney>=0.8 ; sys_platform == 'linux'",
]

[project.scripts]
fbcollector = "fbcollector.__main__:main"

[tool.uv.sources]
fbwire = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fbcollector"]
